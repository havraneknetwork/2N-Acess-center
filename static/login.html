<!DOCTYPE html>
<html lang="cs" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#101828" id="themeColorMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="2N Přihlášení">
  <title>2N Dveře | Přihlášení</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png">

  <script>
    (function () {
      const savedTheme = localStorage.getItem('door_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = savedTheme ? savedTheme === 'dark' : prefersDark;
      if (isDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <link rel="stylesheet" href="/xtrastyle.css?v=20261105_1">
  <link rel="stylesheet" href="/oneui.css?v=20261105_8">
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-950 dark:text-gray-200 antialiased h-screen flex flex-col justify-between p-3 sm:p-5 font-sans overflow-hidden">

  <!-- HORNÍ PŘEPÍNAČ MOTIVU -->
  <div class="flex justify-end w-full">
    <button id="themeToggleBtn" class="flex h-9 w-9 items-center justify-center rounded-xl border border-gray-200 bg-white/80 text-gray-500 backdrop-blur-xs hover:bg-gray-100 hover:text-gray-900 dark:border-gray-800 dark:bg-gray-900/80 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-white transition-colors" title="Přepnout motiv" aria-label="Přepnout motiv">
      <svg class="h-4 w-4 sun-icon dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="h-4 w-4 moon-icon hidden dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>

  <!-- CENTROVANÁ KOMPAKTNÍ KARTA PŘIHLÁŠENÍ (BEZ SCROLLOVÁNÍ) -->
  <main class="w-full max-w-sm mx-auto my-auto">
    <div class="text-center mb-4">
      <div class="mx-auto flex h-11 w-11 items-center justify-center rounded-2xl bg-brand-500 text-white shadow-lg shadow-brand-500/25 mb-2.5">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1 class="text-xl font-bold tracking-tight text-gray-900 dark:text-white">Přihlášení</h1>
      <p class="text-xs text-gray-500 dark:text-gray-400">2N Access Unit M</p>
    </div>

    <div class="rounded-3xl border border-gray-200/80 bg-white p-6 shadow-xl shadow-gray-900/5 dark:border-gray-800 dark:bg-gray-900">

      <!-- UPOZORNĚNÍ -->
      <div id="loginAlert" class="hidden mb-4 rounded-xl border p-2.5 text-xs font-medium"></div>

      <!-- TLAČÍTKO PRO BIOMETRICKÉ PŘIHLÁŠENÍ -->
      <div id="biometricPromptContainer" class="mb-4 pb-4 border-b border-gray-100 dark:border-gray-800 text-center hidden">
        <button type="button" id="biometricLoginBtn" class="w-full flex items-center justify-center gap-2 rounded-xl border border-gray-200 bg-gray-50 px-3 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-100 dark:border-gray-800 dark:bg-gray-800 dark:text-gray-200 dark:hover:bg-gray-700 transition-colors">
          <svg class="h-4 w-4 text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 11c0 3.87-2.69 7-6 7"></path>
            <path d="M12 11c0-3.87 2.69-7 6-7"></path>
            <path d="M7.7 5.7A7.95 7.95 0 0 1 12 4.5c4.42 0 8 3.58 8 8 0 3.32-2.02 6.16-4.9 7.37"></path>
            <path d="M16 11c0 2.21-1.79 4-4 4s-4-1.79-4-4 1.79-4 4-4 4 1.79 4 4z"></path>
            <path d="M4 14.5c0 4.14 3.58 7.5 8 7.5 1.5 0 2.91-.41 4.12-1.13"></path>
          </svg>
          <span id="biometricBtnText">Přihlásit se otiskem prstu</span>
        </button>
      </div>

      <form id="loginForm" class="space-y-3.5">
        <input type="hidden" id="csrfToken" name="csrf_token" value="">

        <div>
          <label for="usernameInput" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Uživatelské jméno</label>
          <input type="text" id="usernameInput" required autocomplete="username" autofocus placeholder="např. admin" class="w-full rounded-xl border border-gray-200 bg-gray-50 px-3 py-2 text-xs text-gray-900 focus:border-brand-500 focus:bg-white focus:outline-none dark:border-gray-800 dark:bg-gray-800/50 dark:text-white transition-all">
        </div>

        <div>
          <label for="passwordInput" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Heslo</label>
          <div class="relative">
            <input type="password" id="passwordInput" required autocomplete="current-password" placeholder="••••••••" class="w-full rounded-xl border border-gray-200 bg-gray-50 px-3 py-2 pr-9 text-xs text-gray-900 focus:border-brand-500 focus:bg-white focus:outline-none dark:border-gray-800 dark:bg-gray-800/50 dark:text-white transition-all">
            <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 flex items-center pr-2.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200" aria-label="Zobrazit heslo">
              <svg id="eyeOpen" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eyeClosed" class="h-3.5 w-3.5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="w-full flex items-center justify-center rounded-xl bg-brand-500 py-2.5 px-4 text-xs font-bold text-white shadow-md shadow-brand-500/25 hover:bg-brand-600 focus:outline-none focus:ring-4 focus:ring-brand-500/20 active:scale-[0.99] transition-all">
          <span id="loginBtnText">PŘIHLÁSIT SE</span>
          <svg id="loginSpinner" class="h-4 w-4 hidden animate-spin text-white" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
        </button>
      </form>
    </div>
  </main>

  <!-- PATIČKA -->
  <footer class="text-center text-[10px] text-gray-400">
    Zabezpečený přístup • Šifrování Argon2id
  </footer>

  <script src="/login.js?v=20261013_2"></script>
</body>
</html>
