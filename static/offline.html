<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a" id="themeColorMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Offline | Šešule Dveře</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Flex:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #000000; --card: #1C1C1E; --border: rgba(255,255,255,0.08);
      --text: #F2F2F2; --text2: #9A9A9D; --blue: #2F7BF6; --blue-glow: rgba(47,123,246,0.35);
      --font: 'Roboto Flex', 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F2F2F2; --card: #ffffff; --border: rgba(0,0,0,0.08);
        --text: #141414; --text2: #68686B; --blue: #2F7BF6; --blue-glow: rgba(47,123,246,0.2);
      }
    }
    html, body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: var(--font);
      display: flex; align-items: center; justify-content: center;
      -webkit-user-select: none; user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .offline-card {
      text-align: center; padding: 44px 28px; max-width: 380px; width: 100%;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 28px; box-shadow: 0 16px 40px rgba(0,0,0,0.4);
    }
    .offline-icon {
      width: 68px; height: 68px; margin: 0 auto 20px auto;
      border-radius: 50%; background: rgba(47,123,246,0.12);
      border: 1px solid rgba(47,123,246,0.25);
      display: flex; align-items: center; justify-content: center;
      animation: pulse-icon 2.5s ease-in-out infinite;
    }
    @keyframes pulse-icon {
      0%, 100% { transform: scale(1); box-shadow: 0 0 16px var(--blue-glow); }
      50% { transform: scale(1.05); box-shadow: 0 0 28px var(--blue-glow); }
    }
    .offline-icon svg { width: 30px; height: 30px; stroke: var(--blue); }
    .offline-tag {
      display: inline-block; background: rgba(47,123,246,0.12); color: var(--blue);
      border-radius: 999px;
      padding: 4px 12px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 14px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.3px; }
    p { font-size: 13.5px; color: var(--text2); line-height: 1.5; margin-bottom: 24px; }
    .retry-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--blue); color: white; border: none; border-radius: 999px;
      padding: 13px 26px; font-size: 13.5px; font-weight: 700; letter-spacing: 0.3px;
      cursor: pointer; box-shadow: 0 4px 16px var(--blue-glow);
      transition: all 0.15s ease; touch-action: manipulation;
      font-family: var(--font);
    }
    .retry-btn:hover { box-shadow: 0 6px 24px var(--blue-glow); }
    .retry-btn:active { transform: scale(0.96); }
    .retry-btn svg { width: 17px; height: 17px; }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <div class="offline-tag">OFFLINE</div>
    <h1>Bez připojení</h1>
    <p>Aplikace Šešule Dveře potřebuje internetové připojení pro přihlášení a komunikaci s 2N jednotkou.</p>
    <button class="retry-btn" onclick="location.reload()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      Zkusit znovu
    </button>
  </div>

  <script>
    // Auto-reload when network comes back
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
